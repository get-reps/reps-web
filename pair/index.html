<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pair your Chrome browser — REPS</title>
  <meta name="description" content="Connect your Chrome browser to your REPS account.">
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFFAF7;
      color: #1F2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .emoji { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.01em; }
    .subtitle { font-size: 15px; color: #6B7280; margin-bottom: 24px; line-height: 1.5; }

    .code-block {
      display: inline-block;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #1F2937;
      background: #FFFFFF;
      border: 1.5px solid #F3E8E0;
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 8px;
      user-select: all;
    }
    .copy-btn {
      display: inline-block;
      background: transparent;
      border: none;
      font-size: 13px;
      color: #D8443F;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      padding: 6px 10px;
      margin-bottom: 24px;
    }
    .copy-btn:hover { text-decoration: underline; }
    .copy-btn.copied { color: #16A34A; }

    .primary-btn {
      display: inline-block;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: white;
      font-size: 17px;
      font-weight: 700;
      padding: 16px 40px;
      border-radius: 16px;
      text-decoration: none;
      margin-bottom: 16px;
      transition: transform 0.15s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .primary-btn:active { transform: scale(0.97); }

    .secondary-link {
      display: block;
      font-size: 14px;
      color: #D8443F;
      font-weight: 600;
      text-decoration: none;
      padding: 8px;
    }
    .secondary-link:hover { text-decoration: underline; }

    .note {
      font-size: 13px;
      color: #6B7280;
      margin-top: 20px;
      line-height: 1.6;
    }

    .hidden { display: none !important; }
    .invalid h1 { color: #DC2626; }
  </style>
</head>
<body>
  <div class="card" id="root">
    <div class="emoji">&#128279;</div>
    <h1 id="title">Pair this browser</h1>
    <p class="subtitle" id="subtitle">Scan the code in the REPS Chrome extension with your iPhone camera.</p>
    <div id="code-area">
      <div class="code-block" id="code-display">--------</div>
      <div>
        <button type="button" class="copy-btn" id="copy-btn">Copy code</button>
      </div>
    </div>
    <a id="store-link" class="primary-btn" href="https://apps.apple.com/app/id6759216018">Get REPS on the App Store</a>
    <a id="open-link" class="secondary-link hidden" href="#">Already have REPS? Open it</a>
    <p class="note" id="note">Already have REPS? Open it &rarr; Settings &rarr; Connect Chrome Extension &rarr; Enter a code.</p>
  </div>
  <script>
    (function() {
      var APP_STORE_URL = 'https://apps.apple.com/app/id6759216018';
      // Set once this device has been sent to the App Store, so a REPS owner whose
      // scan did not open the app (e.g. before iOS picks up the /pair universal link)
      // is never bounced to the store in a loop.
      var STORE_SENT_KEY = 'reps_pair_store_sent';

      // Single normalization rule. Mirrors normalizePairingCode in
      // reps-app/lib/queries/pairings.ts and the extension input handler.
      function normalize(raw) {
        if (typeof raw !== 'string') return '';
        return raw.replace(/\s+/g, '').toUpperCase().slice(0, 8);
      }

      var CODE_REGEX = /^[A-Z2-7]{8}$/;
      var params = new URLSearchParams(window.location.search);
      var code = normalize(params.get('code') || '');

      var root = document.getElementById('root');
      var title = document.getElementById('title');
      var subtitle = document.getElementById('subtitle');
      var codeArea = document.getElementById('code-area');
      var codeDisplay = document.getElementById('code-display');
      var copyBtn = document.getElementById('copy-btn');
      var storeLink = document.getElementById('store-link');
      var openLink = document.getElementById('open-link');
      var note = document.getElementById('note');

      if (!CODE_REGEX.test(code)) {
        root.classList.add('invalid');
        root.innerHTML =
          '<div class="emoji">&#9888;&#65039;</div>' +
          '<h1>Invalid pairing link</h1>' +
          '<p class="subtitle">' +
            'This pairing link is not valid. Open your Chrome extension to generate a fresh QR code, ' +
            'or type the 8-character code into the REPS app on your phone.' +
          '</p>' +
          '<a class="primary-btn" href="https://www.getreps.io">Back to getreps.io</a>';
        return;
      }

      codeDisplay.textContent = code.slice(0, 4) + ' ' + code.slice(4);

      var ua = navigator.userAgent;
      // iPadOS reports a Mac user agent; touch support tells them apart.
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);

      if (isIOS) {
        // With REPS installed, iOS opens the app straight from the QR (universal
        // link on /pair) and this page never loads. Reaching it on an iPhone almost
        // always means REPS is not installed, so lead with the App Store.
        title.textContent = 'Get REPS to finish pairing';
        subtitle.textContent =
          'Pairing your browser needs the REPS iPhone app. Download it, sign up, ' +
          'then scan the code on your computer again.';
        codeArea.classList.add('hidden');
        openLink.href = 'reps://pair?code=' + encodeURIComponent(code);
        openLink.classList.remove('hidden');
        note.classList.add('hidden');

        var alreadySent = false;
        try { alreadySent = window.localStorage.getItem(STORE_SENT_KEY) === '1'; } catch (e) {}
        if (!alreadySent) {
          window.setTimeout(function() {
            if (document.visibilityState !== 'visible') return;
            try { window.localStorage.setItem(STORE_SENT_KEY, '1'); } catch (e) {}
            window.location.href = APP_STORE_URL;
          }, 1500);
        }
      } else if (isAndroid) {
        title.textContent = 'REPS is an iPhone app';
        subtitle.textContent =
          'Pairing your browser needs the REPS iPhone app, so scan the code with an iPhone.';
        codeArea.classList.add('hidden');
        storeLink.classList.add('hidden');
        note.classList.add('hidden');
      } else {
        // Desktop: the link was opened on a computer, not scanned with a phone.
        subtitle.textContent =
          'Scan the code in the REPS Chrome extension with your iPhone camera. ' +
          'New to REPS? Get the iPhone app first.';
      }

      copyBtn.addEventListener('click', function() {
        var write = navigator.clipboard && navigator.clipboard.writeText
          ? navigator.clipboard.writeText(code)
          : Promise.reject();
        write.then(function() {
          copyBtn.textContent = 'Copied';
          copyBtn.classList.add('copied');
          window.setTimeout(function() {
            copyBtn.textContent = 'Copy code';
            copyBtn.classList.remove('copied');
          }, 1500);
        }).catch(function() {
          var range = document.createRange();
          range.selectNodeContents(codeDisplay);
          var sel = window.getSelection();
          if (sel) { sel.removeAllRanges(); sel.addRange(range); }
        });
      });
    })();
  </script>
</body>
</html>
