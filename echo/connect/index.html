<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Connect Echo · REPS</title>
  <script>
    (() => {
      'use strict';
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      let request = fragment.get('request') || '';
      // Fresh links may reuse this tab. Fence the previous token immediately,
      // including clicks while the replacement document is still loading.
      window.addEventListener('hashchange', () => {
        request = '';
        const button = document.getElementById('connect');
        if (button) button.disabled = true;
        window.location.reload();
      });
      const environment = fragment.get('environment');
      const valid = !window.location.search && /^[A-Za-z0-9_-]{43}$/.test(request) && ['staging', 'production'].includes(environment)
        && fragment.getAll('request').length === 1 && fragment.getAll('environment').length === 1
        && [...fragment.keys()].every(key => ['request', 'environment'].includes(key));
      let scrubbed = false;
      try { window.history.replaceState(null, '', window.location.pathname); scrubbed = true; } catch (_) {}
      document.addEventListener('DOMContentLoaded', () => {
        const button = document.getElementById('connect'), status = document.getElementById('status');
        if (window.location.hash || !valid || !scrubbed) {
          request = '';
          button.hidden = true;
          status.textContent = 'Ask Echo for a fresh connection link.';
          return;
        }
        if (environment === 'staging') {
          // The separate staging binary was abandoned. Neither installed REPS
          // app registers its scheme; do not launch it or fall back to the
          // ambiguous reps:// scheme shared by the normal dev and store apps.
          // Re-enable only with a verified compatible dev-client handoff.
          request = '';
          button.hidden = true;
          document.getElementById('title').textContent = 'Back to Echo';
          document.getElementById('intro').textContent = 'This test connection isn’t ready yet. Please return to Messages.';
          status.textContent = '';
          document.getElementById('install').hidden = true;
          return;
        }
        button.disabled = false;
        const scheme = 'reps';
        const openApp = () => {
          if (window.location.hash || !request) return;
          status.textContent = 'Finish connecting in REPS, then come back to Echo 😊';
          try { window.location.assign(`${scheme}://echo-connect#request=${encodeURIComponent(request)}&environment=${environment}`); } catch (_) {}
        };
        button.addEventListener('click', openApp);
        // Safari cannot safely probe a custom scheme: an uninstalled app shows
        // an invalid-address alert. Launch only after the person says they have
        // REPS; the separate installation link never attempts the app scheme.
      });
    })();
  </script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 22px;background:#fffaf7;color:#2a2320;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{width:100%;max-width:410px;text-align:center}img{width:112px;height:112px;object-fit:contain}h1{font-family:Georgia,serif;font-size:34px;line-height:1.15;margin:18px 0}p{color:#6b625e;font-size:17px;line-height:1.55}.actions{display:grid;gap:12px;margin-top:24px}.action{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;padding:18px 16px;border:0;border-radius:16px;font:700 17px/24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;text-decoration:none}.action-open{background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#2a2320}.action-install{background:#2a2320;color:#fffaf7}button:disabled{opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid #2a2320;outline-offset:5px}.status{min-height:44px;font-size:14px}[hidden]{display:none!important}
  </style>
</head>
<body><main>
  <img src="/echo/echo-phone-emoji.png" alt="Echo">
  <h1 id="title">Bring Echo along</h1>
  <p id="intro">Have REPS? Open it to connect. New here? Install it first, then come back to this link.</p>
  <div class="actions">
    <button id="connect" class="action action-open" type="button" disabled>I already have REPS</button>
    <a id="install" class="action action-install" href="https://apps.apple.com/app/id6759216018" rel="noreferrer">Install REPS</a>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <noscript><p>Enable JavaScript to open REPS, or ask Echo for help connecting.</p></noscript>
</main></body>
</html>
