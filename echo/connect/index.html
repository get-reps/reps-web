<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Connect Echo · REPS</title>
  <script>
    (() => {
      'use strict';
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      let request = fragment.get('request') || '';
      const environment = fragment.get('environment');
      const valid = !window.location.search && /^[A-Za-z0-9_-]{43}$/.test(request) && ['staging', 'production'].includes(environment)
        && fragment.getAll('request').length === 1 && fragment.getAll('environment').length === 1
        && [...fragment.keys()].every(key => ['request', 'environment'].includes(key));
      let scrubbed = false;
      try { window.history.replaceState(null, '', window.location.pathname); scrubbed = true; } catch (_) {}
      document.addEventListener('DOMContentLoaded', () => {
        const button = document.getElementById('connect'), status = document.getElementById('status');
        if (!valid || !scrubbed) {
          request = '';
          button.hidden = true;
          status.textContent = 'Ask Echo for a fresh connection link.';
          return;
        }
        button.disabled = false;
        const scheme = environment === 'staging' ? 'reps-echo-staging' : 'reps';
        if (environment === 'staging') {
          status.textContent = 'Open your REPS test app to connect.';
          document.getElementById('install').hidden = true;
        }
        const openApp = () => {
          if (!request) return;
          status.textContent = 'Finish connecting in REPS. Still here? Tap Open REPS.';
          try { window.location.assign(`${scheme}://echo-connect#request=${encodeURIComponent(request)}&environment=${environment}`); } catch (_) {}
        };
        button.addEventListener('click', openApp);
        // Universal Links open the app before this page loads. If iOS kept the
        // browser (for example, a same-domain tap), try once and retain the button.
        // Never auto-install, call Auth, or persist a connection token in the browser.
        const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
          || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        if (mobile && document.visibilityState === 'visible') openApp();
      });
    })();
  </script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 22px;background:#fffaf7;color:#2a2320;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{width:100%;max-width:410px;text-align:center}img{width:112px;height:112px;object-fit:contain}h1{font-family:Georgia,serif;font-size:34px;line-height:1.15;margin:18px 0}p{color:#6b625e;font-size:17px;line-height:1.55}button{width:100%;margin-top:14px;padding:18px;border:0;border-radius:16px;background:linear-gradient(135deg,#ff6b6b,#ff8e53);font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2a2320;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid #2a2320;outline-offset:5px}a{color:#9e3936}.status{min-height:44px;font-size:14px}[hidden]{display:none!important}
  </style>
</head>
<body><main>
  <img src="/echo/echo-phone-emoji.png" alt="Echo">
  <h1>Bring Echo along</h1>
  <p>Connect this chat to the REPS account you already use.</p>
  <button id="connect" type="button" disabled>Open REPS</button>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <p id="install"><a href="https://apps.apple.com/app/id6759216018" rel="noreferrer">Get REPS</a></p>
  <noscript><p>Enable JavaScript to open REPS, or ask Echo for help connecting.</p></noscript>
</main></body>
</html>
