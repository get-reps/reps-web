<!doctype html>
<!-- /watch — shareable full-screen demo video.
     Device-switches: touch/narrow → vertical (iPhone) cut, computer → horizontal cut.
     Autoplay muted + loop; one 🔊 toggle adds sound (restarts so music starts from the top).
     Videos hosted on Supabase Storage `web-media` bucket (not in git). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>REPS — Watch</title>
    <meta name="description" content="REPS in one minute. Save anything, remember everything." />
    <!-- Shareable, but kept out of search until launch -->
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="REPS — Watch" />
    <meta property="og:description" content="Save anything. Remember everything. REPS in one minute." />
    <meta property="og:url" content="https://www.getreps.io/watch" />
    <meta property="og:type" content="video.other" />
    <meta
      property="og:image"
      content="https://vciosaulrfvddcenblmo.supabase.co/storage/v1/object/public/web-media/watch/poster-v16.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="REPS — your second brain" />
    <!-- Video unfurl: Slack reads these to show an inline player; WhatsApp/iMessage
         show the poster image and open the page (which autoplays) on tap. -->
    <meta
      property="og:video"
      content="https://vciosaulrfvddcenblmo.supabase.co/storage/v1/object/public/web-media/watch/desktop-v16.mp4"
    />
    <meta
      property="og:video:secure_url"
      content="https://vciosaulrfvddcenblmo.supabase.co/storage/v1/object/public/web-media/watch/desktop-v16.mp4"
    />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1920" />
    <meta property="og:video:height" content="1080" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://vciosaulrfvddcenblmo.supabase.co/storage/v1/object/public/web-media/watch/poster-v16.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --galaxy: #040409;
        --coral: #ff6b6b;
        --peach: #ff8e53;
        --display: "Space Grotesk", system-ui, -apple-system, sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: var(--galaxy);
        color: #fff;
        font-family: var(--display);
        -webkit-font-smoothing: antialiased;
      }
      .page {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }
      /* Header */
      header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 22px;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 9px;
        text-decoration: none;
        color: #fff;
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 0.04em;
      }
      .wordmark img {
        width: 26px;
        height: 26px;
        border-radius: 6px;
      }
      .home-link {
        font-size: 13px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        transition: color 0.15s;
      }
      .home-link:hover {
        color: #fff;
      }
      /* Stage */
      .stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        position: relative;
      }
      /* Shrinks to the rendered video so the sound pill anchors to the video's
         corner (not the stage), overlapping the video even when the landscape
         cut is centered with dark bands above/below it. */
      .video-wrap {
        position: relative;
        display: inline-block;
        max-width: 100%;
        max-height: 100%;
        line-height: 0;
      }
      #vid {
        max-width: 100%;
        /* Bound to the space between the header banner and the footer CTA so the
           video is truly centered there (and never overflows past the CTA). */
        max-height: calc(100svh - 172px);
        border-radius: 18px;
        box-shadow: 0 30px 80px -28px rgba(0, 0, 0, 0.85);
        background: #000;
      }
      /* Sound toggle pill */
      .sound {
        position: absolute;
        top: 16px;
        right: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 18px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        background: rgba(10, 10, 16, 0.62);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #fff;
        font-family: var(--display);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.15s,
          background 0.15s;
      }
      .sound:hover {
        background: rgba(20, 20, 28, 0.8);
        transform: translateY(-1px);
      }
      .sound svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      /* Pulse to invite the first tap while still muted */
      .sound.muted {
        animation: soundpulse 2.4s ease-in-out infinite;
      }
      /* Once sound is on, fade the nudge out for good so it never covers the video. */
      .sound.is-hidden {
        opacity: 0;
        pointer-events: none;
        animation: none;
      }
      @keyframes soundpulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 142, 83, 0);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(255, 142, 83, 0.12);
        }
      }
      /* Footer — inline waitlist capture (email left, CTA right) */
      footer {
        flex: 0 0 auto;
        text-align: center;
        padding: 14px 22px 26px;
      }
      .wl {
        display: flex;
        gap: 8px;
        width: min(520px, 92vw);
        margin: 0 auto;
      }
      .wl input {
        flex: 1 1 auto;
        min-width: 0;
        height: 50px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.96);
        padding: 0 18px;
        font-family: var(--display);
        font-size: 15px;
        color: #1a1a22;
        outline: none;
        transition:
          box-shadow 0.15s,
          border-color 0.15s;
      }
      .wl input::placeholder {
        color: rgba(33, 26, 20, 0.5);
      }
      .wl input:focus {
        border-color: var(--coral);
        box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.28);
      }
      .wl button {
        flex: 0 0 auto;
        height: 50px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        font-family: var(--display);
        font-weight: 600;
        font-size: 15px;
        color: #fff;
        background: linear-gradient(135deg, var(--coral), var(--peach));
        box-shadow: 0 6px 20px -6px rgba(255, 107, 107, 0.5);
        transition:
          opacity 0.15s,
          transform 0.15s;
      }
      .wl button:hover {
        opacity: 0.92;
        transform: translateY(-1px);
      }
      .wl button:disabled {
        opacity: 0.6;
        cursor: default;
        transform: none;
      }
      .wl-msg {
        min-height: 16px;
        margin-top: 8px;
        font-size: 13px;
        color: #ffb3a7;
      }
      .wl-success {
        max-width: 520px;
        margin: 0 auto;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        color: #fff;
      }
      /* ── App Store install badge (canonical black) ── */
      .appstore-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        min-height: 54px;
        padding: 0 22px;
        border-radius: 13px;
        text-decoration: none;
        background: #000;
        color: #fff;
        /* hairline so the black badge reads against the galaxy-black page */
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.8);
        transition:
          transform 0.15s,
          border-color 0.15s;
      }
      .appstore-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.5);
      }
      .appstore-btn:active {
        transform: translateY(0);
      }
      .appstore-btn svg {
        width: 25px;
        height: 30px;
        flex: none;
      }
      .appstore-label {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        line-height: 1;
        text-align: left;
        /* SF on Apple devices → matches the real badge */
        font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI",
          sans-serif;
      }
      .appstore-label .small {
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.01em;
        margin-bottom: 2px;
      }
      .appstore-label .big {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .sound.muted {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="wordmark" href="/" aria-label="REPS home">
          <img src="/product/assets/app-icon.png" alt="" />
          REPS
        </a>
        <a class="home-link" href="/">getreps.io ↗</a>
      </header>

      <main class="stage">
        <div class="video-wrap">
          <video
          id="vid"
          muted
          playsinline
          autoplay
          loop
          controls
          controlslist="nodownload noplaybackrate noremoteplayback"
          poster="https://vciosaulrfvddcenblmo.supabase.co/storage/v1/object/public/web-media/watch/poster-v16.jpg"
          preload="auto"
        ></video>
        <button class="sound muted" id="sound" type="button" aria-label="Turn sound on">
          <span id="sound-icon"></span>
          <span id="sound-label">Tap for sound</span>
        </button>
        </div>
      </main>

      <footer>
        <a
          class="appstore-btn"
          href="https://apps.apple.com/app/id6759216018"
          target="_blank"
          rel="noopener"
          aria-label="Download REPS on the App Store"
        >
          <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true">
            <path
              d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"
            />
          </svg>
          <span class="appstore-label">
            <span class="small">Download on the</span>
            <span class="big">App Store</span>
          </span>
        </a>
      </footer>
    </div>

    <script>
      (function () {
        var BASE =
          "https://vciosaulrfvddcenblmo.supabase.co/storage/v1/object/public/web-media/watch/";
        var vid = document.getElementById("vid");
        var sound = document.getElementById("sound");
        var icon = document.getElementById("sound-icon");
        var label = document.getElementById("sound-label");

        // Device switch: any touch device OR a narrow window → vertical (iPhone) cut.
        var wantVertical =
          window.matchMedia("(pointer: coarse)").matches ||
          window.matchMedia("(max-width: 819px)").matches;
        vid.src = BASE + (wantVertical ? "mobile-v7.mp4" : "desktop-v16.mp4");
        vid.play().catch(function () {});

        var SPEAKER_OFF =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
        icon.innerHTML = SPEAKER_OFF;

        // The pill is a one-time "turn sound on" nudge. Once sound is on it fades
        // out and stays gone so it never covers the video. (Native controls below
        // still let the user re-mute / scrub.)
        function dismissSound() {
          sound.classList.remove("muted");
          sound.classList.add("is-hidden");
        }

        sound.addEventListener("click", function () {
          vid.muted = false;
          vid.currentTime = 0; // start music from the top
          vid.play().catch(function () {});
          dismissSound();
        });

        // If the user turns sound on via the native controls instead, dismiss too.
        vid.addEventListener("volumechange", function () {
          if (!vid.muted) dismissSound();
        });
      })();
    </script>
  </body>
</html>
