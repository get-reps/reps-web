<!doctype html>
<!--
CONCEPT NOTE (cs-c-lora: cs-c with Lora as the page voice, the Diary of a CEO cover removed, and ?h=1..6 headline options)
Lora variant: display lines, captions and the close are Lora (500 display; the key phrase is Lora italic in the coral gradient); sans stays on the eyebrow label, buttons, the top-bar link and in-game labels.
Round 2: scene captions sit ABOVE the scenes as headings; the icon is the real 512px icon as a glossy CSS tile that tilts slowly (idle loop + pointer, within 6 degrees); covers are 1.3x and sit in the front slots, paper is 0.85x; the mid-story gap is closed.
?h=1 (default) "Turn what you save into what you know." · 2 bookmarks · 3 reading more · 4 organize and retain · 5 read, watch and hear · 6 "Turn media into knowledge." The close always repeats the hero line.
CONCEPT NOTE (cs-c, founder storyboard)
1. Idea: everything you take in is pulled into one place, and comes back out as play.
2. Hero: "Turn media into knowledge." at rest beside a slowly turning sphere of real covers and code-drawn article cards.
3. Signature motion, part one: scroll pulls each cover off the sphere and down a curved path into the REPS icon, one by one, each arrival a small pulse.
4. Part two: points of warm light travel out of the icon on thin lines and open into four scenes made from what went in.
5. Scenes: a 1984 crossword fragment, a Huberman Lab trivia card, a three-card feed of ideas, a daily round ring that fills (no digits).
6. Close: the scenes fold back into light, the light into the icon, and the headline returns with the one coral action.
7. Words: one line per screen at most; REPS says under forty words of its own, everything else is the material.
8. Motion is on by default; one 30 fps loop runs only while the story is on screen and the tab is visible: the sphere turns, then the icon breathes, the links pulse and the active scene has one small living beat.
9. Refused: phone frames, app screenshots, a knowledge graph, feature lists, testimonials, numbers, the manifesto (it made the page long).
10. Flags: ?static=1 static page (the only motion off switch), ?motion=1 capture mode, &at=0..1 pins the story progress (idle motion still runs).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REPS · Turn what you save into what you know.</title>
<meta name="description" content="Save what you read, watch and listen to. REPS turns it into short daily games, so it stays with you. Free on the App Store.">
<meta name="theme-color" content="#FFFAF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFFAF7; --ink:#211A14; --ink-2:rgba(33,26,20,.62); --ink-3:rgba(33,26,20,.42);
  --line:rgba(33,26,20,.10); --paper:#FFFDFB; --gold:#D4A24E; --glow:#FFD27D; --teal:#2D8377;
  /* sans is for labels and interactive things (the eyebrow, buttons, the top-bar link, in-game labels); Lora is the voice */
  --sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Lora",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
img{display:block}

/* nav */
.nav{position:fixed;inset:0 0 auto 0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);z-index:50;pointer-events:none}
.nav>*{pointer-events:auto}
.wordmark{font-weight:700;font-size:20px;letter-spacing:.14em}
.nav-get{font-size:14px;font-weight:500;padding:9px 16px;border:1px solid rgba(33,26,20,.22);border-radius:999px;background:rgba(255,250,247,.8);
  transition:background .2s,color .2s,opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s;opacity:0;visibility:hidden;transform:translateY(-10px)}
.nav-get.on{opacity:1;visibility:visible;transform:none;transition:background .2s,color .2s,opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
.nav-get:hover{background:var(--ink);color:var(--cream)}

/* the one action */
.cta{display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 30px;border-radius:999px;
  background:linear-gradient(100deg,#FF6B6B 0%,#FF8E53 100%);color:#fff;font-weight:600;font-size:16px;letter-spacing:.005em;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 14px 34px -14px rgba(255,107,107,.75);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 20px 40px -14px rgba(255,107,107,.85)}

/* story */
.story{position:relative;height:720vh}
.sticky{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.stage{position:absolute;inset:0;perspective:1400px}
html.pinned .story{height:100vh}
html.pinned body{overflow:hidden}
html.pinned .after{display:none}
html.static .story{height:auto}
html.static .sticky{position:relative;height:100vh;height:clamp(640px,100svh,960px)}

.lines{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.lines line{stroke:rgba(214,164,82,.62);stroke-width:1.2;stroke-linecap:round}
.lines .spark{fill:#FFF6E2;opacity:0;filter:drop-shadow(0 0 3px rgba(255,200,110,.95))}
.halo{position:absolute;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;z-index:1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,210,125,.42),rgba(255,210,125,.14) 45%,rgba(255,210,125,0) 100%)}

/* hero */
.hero{position:absolute;z-index:45;left:clamp(24px,7.8vw,140px);top:50%;width:min(46vw,720px)}
.eyebrow{font-family:var(--sans);font-style:normal;font-weight:600;font-size:13px;line-height:1.2;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin-bottom:26px}
.hero h1,.close h2{font-family:var(--serif);font-weight:500;letter-spacing:-.022em;line-height:1.06;font-size:clamp(40px,4.62vw,72px);
  text-wrap:balance;font-kerning:normal;font-feature-settings:"kern","liga"}
/* the key phrase: Lora italic in the brand coral gradient, biased to its coral end so the light end still reads on cream.
   padding gives the italic overhang and descenders room inside the clipped background; the matching negative margin keeps spacing unchanged */
.hero h1 em,.close h2 em{font-style:italic;font-weight:500;letter-spacing:-.01em;
  background:linear-gradient(100deg,#E8504B 0%,#FF6B6B 52%,#FF8E53 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  padding:.06em .14em .16em .08em;margin:0 -.14em 0 -.08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero h1{max-width:100%}
.close h2{max-width:min(92vw,10em)}   /* the hero measure (46vw at 4.62vw type), so the close breaks like the hero */
.hero .cta{margin-top:46px}

/* the sphere's body: a soft volume and a shadow on the ground */
.orb,.floor{position:absolute;left:0;top:0;width:100px;height:100px;border-radius:50%;pointer-events:none;will-change:transform,opacity}
.orb{background:radial-gradient(closest-side,rgba(248,232,216,.62),rgba(248,232,216,.3) 50%,rgba(248,232,216,.08) 78%,rgba(248,232,216,0))}
.floor{background:radial-gradient(closest-side,rgba(33,26,20,.11),rgba(33,26,20,.045) 55%,rgba(33,26,20,0))}
/* sphere items */
.item{position:absolute;left:0;top:0;will-change:transform,opacity;transform-origin:50% 50%;backface-visibility:hidden}
.item img{width:100%;height:100%;object-fit:cover}
/* depth is shown by scale and a cream wash laid over the item, never by making the item see-through */
.item .wash{position:absolute;inset:-1px;border-radius:inherit;background:var(--cream);opacity:0;pointer-events:none;z-index:2}
.it-book img{border-radius:3px 5px 5px 3px}
.it-book{border-radius:3px 5px 5px 3px;box-shadow:0 1px 2px rgba(33,26,20,.18),0 18px 30px -14px rgba(33,26,20,.45)}
.it-book::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.10) 4%,rgba(0,0,0,0) 9%)}
.it-pod,.it-pod img{border-radius:12px}
.it-pod{box-shadow:0 1px 2px rgba(33,26,20,.16),0 16px 28px -14px rgba(33,26,20,.42)}
.it-vid,.it-vid img{border-radius:10px}
.it-vid{box-shadow:0 1px 2px rgba(33,26,20,.16),0 16px 28px -14px rgba(33,26,20,.42)}
.it-art,.it-hl,.it-qc,.it-pdf,.it-note,.it-shot{border-radius:12px;padding:12px 13px;background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 2px rgba(33,26,20,.06),0 16px 28px -16px rgba(33,26,20,.35);display:flex;flex-direction:column;justify-content:space-between}
.it-art .pub{font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.it-art .ttl{font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.18;color:var(--ink)}
.it-hl{background:#FBF2E8;border-color:rgba(212,162,78,.28)}
.it-hl .qt{font-family:var(--serif);font-style:italic;font-size:12.5px;line-height:1.32;color:var(--ink)}
.it-hl .by{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(160,112,40,.9)}
.it-art .au{font-size:10px;font-weight:500;color:var(--ink-2)}
.it-art .ttl{flex:1;display:flex;align-items:center}
.it-hl .qt mark{background:linear-gradient(transparent 12%,rgba(255,210,125,.75) 12%,rgba(255,210,125,.75) 88%,transparent 88%);color:inherit;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.it-qc .mk{font-family:var(--serif);font-size:34px;line-height:.6;color:rgba(33,26,20,.28);height:14px}
.it-qc .qt{font-family:var(--serif);font-weight:600;font-size:13.5px;line-height:1.22;color:var(--ink)}
.it-qc .by,.it-pdf .by{font-size:9.5px;font-weight:500;color:var(--ink-2)}
.it-pdf{padding:11px 12px}
.it-pdf .tag{align-self:flex-start;font-size:8.5px;font-weight:700;letter-spacing:.12em;color:var(--ink-2);border:1px solid rgba(33,26,20,.32);border-radius:4px;padding:2px 5px}
.it-pdf .ttl{font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.16;color:var(--ink)}
.it-pdf .rl{display:grid;gap:4px}
.it-pdf .rl i{display:block;height:3px;border-radius:2px;background:rgba(33,26,20,.09)}
.it-pdf .rl i:nth-child(2){width:86%}.it-pdf .rl i:nth-child(3){width:64%}
.it-note{background:#FFFBF0;background-image:repeating-linear-gradient(transparent 0 21px,rgba(76,95,171,.13) 21px 22px);background-position:0 9px;padding:9px 13px}
.it-note .hw{font-family:"Caveat","Segoe Print","Bradley Hand",cursive;font-weight:500;font-size:19px;line-height:22px;color:#3A3128;transform:rotate(-1.5deg);transform-origin:0 0}
.it-shot{background:#F3EEE8;border-color:rgba(33,26,20,.06);justify-content:center;padding:16px 16px;position:relative}
.it-shot .tx{font-size:13.5px;font-weight:500;line-height:1.3;color:var(--ink)}
.it-shot .tx .lora{font-size:13.5px}
.it-shot .k{position:absolute;width:12px;height:12px;border:0 solid rgba(33,26,20,.55)}
.it-shot .k1{left:5px;top:5px;border-left-width:2px;border-top-width:2px}
.it-shot .k2{right:5px;top:5px;border-right-width:2px;border-top-width:2px}
.it-shot .k3{left:5px;bottom:5px;border-left-width:2px;border-bottom-width:2px}
.it-shot .k4{right:5px;bottom:5px;border-right-width:2px;border-bottom-width:2px}

/* icon */
/* the real icon (512px downscale of the 1024 master, never redrawn) as a glossy physical tile:
   iOS-style rounded square, a top-left specular, a faint inner bevel, a layered shadow, and a slow tilt from the idle loop + pointer.
   no will-change: a transform layer would be rasterised at its first (small) scale and look soft */
.icon{position:absolute;left:0;top:0;z-index:40;width:112px;height:112px;border-radius:25px;
  box-shadow:0 0 0 .5px rgba(4,4,9,.4),0 1px 1.5px rgba(4,4,9,.28),0 5px 9px -3px rgba(4,4,9,.28),0 20px 32px -14px rgba(4,4,9,.48),0 40px 64px -30px rgba(70,40,15,.38)}
.icon img{width:100%;height:100%;border-radius:inherit}
.icon::before,.icon::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.icon::before{background:
  radial-gradient(ellipse 72% 58% at var(--lx,30%) var(--ly,16%),rgba(255,255,255,.30) 0%,rgba(255,255,255,.10) 40%,rgba(255,255,255,0) 70%),
  linear-gradient(180deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 34%,rgba(0,0,0,0) 72%,rgba(0,0,0,.16) 100%)}
.icon::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 1px 0 0 rgba(255,255,255,.07),inset -1px 0 0 rgba(0,0,0,.25),inset 0 -2px 3px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.06)}
.ishadow{position:absolute;left:0;top:0;z-index:39;width:112px;height:26px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(33,26,20,.30),rgba(33,26,20,.12) 55%,rgba(33,26,20,0))}

/* nodes of light */
.node{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;z-index:6;will-change:transform,opacity;
  background:#fff;box-shadow:0 0 0 2px rgba(255,236,196,.9),0 0 14px 5px rgba(255,210,125,.85),0 0 46px 16px rgba(255,190,110,.35)}

/* scenes */
.scene{position:absolute;left:0;top:0;width:340px;z-index:10;will-change:transform,opacity;transform-origin:50% 50%}
.src{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;color:var(--ink-2)}
.src img{border-radius:3px;box-shadow:0 6px 12px -6px rgba(33,26,20,.5)}
.lora{font-family:var(--serif);font-style:normal;font-weight:600;color:var(--ink)}
/* small source labels are small print: sans, the title in a heavier weight */
.src .lora,.fc .s .lora{font-family:var(--sans);font-weight:600}

.sc-xw{display:flex;flex-direction:column;align-items:center;gap:16px}
.grid{display:grid;grid-template-columns:repeat(7,40px);grid-auto-rows:40px;gap:4px}
.cell{position:relative;border-radius:7px}
.cell.t{background:var(--paper);border:1px solid rgba(33,26,20,.13);box-shadow:0 1px 0 rgba(33,26,20,.06),0 10px 18px -12px rgba(33,26,20,.35);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:21px;color:var(--ink)}
.cell.hot{background:#FBEED4;border-color:rgba(212,162,78,.6)}
.cell .l{display:inline-block;will-change:transform,opacity}
.cell.cur{border-color:rgba(201,146,62,.95);box-shadow:0 0 0 2px rgba(212,162,78,.35),0 10px 18px -12px rgba(33,26,20,.35)}
.cell i{position:absolute;left:4px;top:2px;font-family:var(--sans);font-style:normal;font-size:8.5px;font-weight:600;color:var(--ink-3)}
.clue{font-size:13px;color:var(--ink-2)}
.clue b{color:var(--ink);font-weight:600;margin-right:6px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 2px rgba(33,26,20,.05),0 30px 60px -30px rgba(33,26,20,.45)}
.sc-tv .card{padding:20px 20px 18px}
.sc-tv .src img{width:40px;height:40px;border-radius:9px}
.q{font-size:17px;font-weight:600;line-height:1.28;letter-spacing:-.01em;margin:16px 0 14px}
.ans{list-style:none;display:grid;gap:7px}
.ans li{height:38px;border-radius:12px;border:1px solid rgba(33,26,20,.12);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:14px;font-weight:500;color:var(--ink-2)}
.ans li.on{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 12px 22px -12px rgba(45,131,119,.8)}
.ans li.on::after{content:"";width:14px;height:8px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-2px) rotate(-45deg)}

.sc-feed{display:grid;gap:9px}
.fc{display:flex;gap:13px;align-items:center;padding:11px 14px 11px 11px;border-radius:16px}
.fc .th{flex:none;width:64px;display:flex;justify-content:center}
.fc .th img{width:42px;height:auto;border-radius:3px;box-shadow:0 6px 12px -6px rgba(33,26,20,.5)}
/* a video keeps its 16:9 frame so the thumbnail's own lettering reads whole */
.fc .th img.w{width:64px;height:36px;object-fit:cover;border-radius:6px}
.fc .th .rule{width:42px;height:42px;border-radius:8px;background:#F4ECE2;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;color:rgba(33,26,20,.55)}
.fc .tx{min-width:0}
.fc .s{font-size:11px;color:var(--ink-3);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .s .lora{font-size:11.5px;color:var(--ink-2)}
.fc .i{font-family:var(--serif);font-size:14.5px;font-weight:400;line-height:1.32;color:var(--ink)}
.fc{will-change:transform}

.sc-day{display:flex;align-items:center;justify-content:center}
.ring{position:relative;width:216px;height:216px}
.ring svg{position:absolute;inset:0}
.ring .core{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,210,125,.55),rgba(255,210,125,.16) 55%,rgba(255,210,125,0));will-change:transform,opacity}
/* what today's round is made of: one real cover per arc, the third lights up as its arc fills */
.sc-day{flex-direction:column;gap:14px}
.ring .chips{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:7px;transform:translate(-50%,-50%)}
.ring .chips img{display:block;box-shadow:0 8px 14px -8px rgba(33,26,20,.55)}
.ring .chips .bk{width:30px;height:45px;border-radius:2px 3px 3px 2px}
.ring .chips .sq{width:38px;height:38px;border-radius:8px}
.ring .chips .c3{will-change:opacity}
.day-lbl{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}

/* captions */
.cap{position:absolute;left:50%;top:0;z-index:45;text-align:center;width:min(92vw,900px);margin-left:calc(min(92vw,900px) / -2);will-change:transform,opacity;pointer-events:none}
.cap{font-family:var(--serif);text-wrap:balance}
.cap-a{font-size:clamp(24px,2.7vw,38px);font-weight:400;line-height:1.18;letter-spacing:-.015em;color:var(--ink-2)}
.cap-a b{display:block;color:var(--ink);font-style:italic;font-weight:500;font-size:1.42em;letter-spacing:-.02em;line-height:1.05;margin-top:.14em}
.cap-s{font-size:clamp(28px,3vw,46px);font-weight:500;line-height:1.12;letter-spacing:-.02em;color:var(--ink)}
/* desktop: each title sits directly over its own scene, at a size that belongs to the scene */
.cap-s.over{font-size:clamp(22px,1.95vw,30px)}

/* close */
.close{position:absolute;left:0;right:0;top:0;z-index:30;text-align:center;display:flex;flex-direction:column;align-items:center;will-change:transform,opacity}
.close .cta{margin-top:40px}
.close small{display:block;margin-top:16px;font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink-3);letter-spacing:.01em}

.after{padding:48px clamp(20px,5vw,72px) 56px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line)}
.after .wordmark{font-size:15px;color:var(--ink)}
.after .fine{font-family:var(--sans);font-size:13px}

@media (max-width:759px){
  .nav{height:64px}
  .wordmark{font-size:17px}
  .nav-get{font-size:13px;padding:7px 13px}
  .hero{left:24px;right:24px;width:auto;top:15svh}
  .eyebrow{font-size:11.5px;letter-spacing:.18em;margin-bottom:14px}
  .hero h1,.close h2{font-size:clamp(32px,9vw,42px);line-height:1.08;letter-spacing:-.02em}
  .hero h1{max-width:none}
  .close h2{max-width:calc(100vw - 48px)}
  .hero .cta{margin-top:26px}
  .cta{height:52px;padding:0 26px;font-size:15px}
  .icon{width:92px;height:92px;border-radius:21px}
  .ishadow{width:92px;height:22px}
  .close .cta{margin-top:28px}
  .cap-a{width:330px;margin-left:-165px;font-size:24px}
  .cap-s{width:340px;margin-left:-170px;font-size:28px}
  .after{flex-direction:column;gap:10px}
}
</style>
</head>
<body>
<header class="nav">
  <a class="wordmark" href="#" aria-label="REPS home">REPS</a>
  <a class="nav-get" href="https://apps.apple.com/app/id6744420866">Get the app</a>
</header>

<main>
  <section class="story" id="story" aria-label="Turn what you save into what you know."></section>
</main>

<footer class="after">
  <span class="wordmark">REPS</span>
  <span class="fine">Free on the App Store · iPhone</span>
</footer>

<template id="tpl">
  <div class="stage">
    <div class="halo"></div>
    <svg class="lines" aria-hidden="true">
      <line/><line/><line/><line/>
    </svg>
    <div class="orb"></div><div class="floor"></div>
    <div class="items"></div>

    <div class="hero">

    {k:'art',  pub:'The Atlantic', ttl:'Is Google Making Us Stupid?'},
    {k:'qc',   qt:'Who controls the past controls the future.', by:'George Orwell · 1984'},
    {k:'pdf',  ttl:'The Art of War', by:'Sun Tzu'},
    {k:'art',  pub:'The New Yorker', ttl:'Why Facts Don’t Change Our Minds'},
    {k:'note', tx:'Ask Dad what he thinks about the wheat bit in Sapiens.'},
    {k:'hl',   qt:'You do not rise to the level of your goals. You fall to the level of your systems.', by:'James Clear · Atomic Habits'},

    {k:'qc',   qt:'The unexamined life is not worth living.', by:'Socrates, via Plato’s Apology', sz:[158, 116]},

  const LAYOUT = 'KCKKCKCKKCKKCCCKKC';   // front slots by mean depth over that window: 9,14,12,17,4,6,1; far side: 13
  const ITEMS = [];
  { let ci = 0, ki = 0; for (const ch of LAYOUT) ITEMS.push(ch === 'C' ? COVERS[ci++] : CARDS[ki++]); }

  const FIT = ITEMS.map(it => it.src ? 1 : 0.85);
  const N = ITEMS.length;

  // a fixed shuffle so books, podcasts, videos and articles arrive interleaved
  const ORDER = Array.from({length: N}, (_, i) => i).sort((a, b) => ((a * 7919) % 31) - ((b * 7919) % 31));

    const y = 1 - (i + 0.5) / N * 2, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const lp = (A, B, t) => [lerp(A[0], B[0], t), lerp(A[1], B[1], t)];
  const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const eo = t => 1 - Math.pow(1 - t, 3);
  const ei = t => t * t * t;
  const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const back = t => { const c = 1.45; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // timeline: the lights leave as the last cover lands and the first scene opens at 0.40, straight after the absorption caption, so there is no bare stretch
  const SCENE_OPEN = [0.40, 0.49, 0.58, 0.67];

  function geo(w, h, heroH = 180, closeH = 190) {
    const m = w < 760;
    if (!m) {
      const k = Math.min(1.05, Math.max(0.78, Math.min(h / 900, w / 1440)));
      // the heading band is the top ~22% of the screen; the icon and the four scenes sit beneath it
      const icon = [w / 2, h * 0.58];
      const dx = Math.min(w * 0.275, 410), dy = h * 0.235;
      const sp = [[-dx, -dy], [dx, -dy], [-dx, dy], [dx, dy]].map(d => [icon[0] + d[0], icon[1] + d[1]]);
      return { m, k, heroC: [w * 0.725, h * 0.52], R: Math.min(h * 0.29, w * 0.175), persp: 1000, iSc: k * 0.8,
        iconA: icon, iconS: icon, iconC: [w / 2, h * 0.31], iconSize: 112,

    // phone: the hero text and the sphere are laid out as one composition that fills the first screen.
    // the sphere's visible extent runs ~1.12R above its centre (the top items) to ~1.45R below (the ground shadow);
    // the spare height is shared out: a little above the headline, a matching breath under the button, the rest as ground.
    const NAV = 64;
    const R = Math.min(w * 0.37, Math.max(96, (h - NAV - heroH - 110) / 2.57));

    const rr = 74;
    const nodeT = [[-1, -0.35], [1, -0.35], [-1, 0.75], [1, 0.75]].map(d => [iconS[0] + d[0] * rr * 1.25, iconS[1] + d[1] * rr]);
    // the close (icon over headline, button, small print) sits centred
    const iconC = [w / 2, Math.max(h * 0.3, (h - (92 + 34 + closeH)) * 0.5 + 46)];
    return { m, k: 1, heroTop, heroC, R, persp: 800, iSc: 0.54 * clamp(R / 128, 0.9, 1.12),
      iconA: [w / 2, h * 0.47], iconS, iconC, iconSize: 92,
      nodeT, sceneP: nodeT.map(() => [w / 2, h * 0.69]), sceneSc: Math.min(1, (w - 30) / 340),

  }

  function itemSize(it) {
    if (it.sz) return it.sz;
    if (it.k === 'book') return [146 * it.a, 146];   // 1.3x the round-1 size
    if (it.k === 'pod') return [117, 117];
    if (it.k === 'vid') return [195, 109];
    if (it.k === 'art') return it.au ? [140, 100] : [138, 92];
    if (it.k === 'qc') return [140, 104];
    if (it.k === 'pdf') return [112, 146];
    if (it.k === 'note') return [146, 102];
    if (it.k === 'shot') return [150, 86];
    return [158, 112];
  }

  class Stage {
    constructor(host) {
      host.appendChild(document.getElementById('tpl').content.cloneNode(true));
      const q = s => host.querySelector(s), qa = s => [...host.querySelectorAll(s)];
      this.host = host;
      this.hero = q('.hero'); this.icon = q('.icon'); this.ishadow = q('.ishadow'); this.tilt = [0, 0]; this.halo = q('.halo'); this.close = q('.close');

      this.scenes = qa('.scene'); this.capA = q('.cap-a'); this.capS = qa('.cap-s');

      // numbered in reading order: 1 BIG (down), 2 ROOM (down), 3 WINSTON (across)
      const nums = { '0,1': 1, '0,5': 2, '1,0': 3 };

        grid.appendChild(d);

      // daily round: three arcs, two done

        p.setAttribute('d', `M${cx + r * Math.cos(a0)} ${cx + r * Math.sin(a0)} A${r} ${r} 0 0 1 ${cx + r * Math.cos(a1)} ${cx + r * Math.sin(a1)}`);

        if (it.src) { const im = new Image(); im.src = C + it.src; im.alt = ''; im.decoding = 'async'; el.appendChild(im); }
        else {
          const add = (cls, txt, tag = 'span') => { const e = document.createElement(tag); e.className = cls; if (txt != null) e.textContent = txt; el.appendChild(e); return e; };

        const wash = document.createElement('i'); wash.className = 'wash'; el.appendChild(wash);
        wrap.appendChild(el);
        return el;
      });

      this.chip3 = q('.ring .chips .c3');
      this.measure();
    }
    measure() {
      this.w = this.host.clientWidth; this.h = this.host.clientHeight;
      this.heroH = this.hero.offsetHeight;
      this.g = geo(this.w, this.h, this.heroH, this.close.offsetHeight);
      // phone: the hero's top comes from the composition (desktop keeps its CSS centring)
      this.hero.style.top = this.g.heroTop != null ? this.g.heroTop.toFixed(1) + 'px' : '';
      this.svg.setAttribute('viewBox', `0 0 ${this.w} ${this.h}`);
      this.capS.forEach(c => c.classList.toggle('over', !this.g.m));
      this.sceneWH = this.scenes.map(el => [el.offsetWidth, el.offsetHeight]);
    }
    render(p, yaw, pitch, t = 0) {
      const g = this.g, w = this.w, h = this.h;
      const TAU = Math.PI * 2;
      // idle: once the sphere is absorbed the story goes on breathing by itself (t = idle seconds)
      const settled = sm(0.34, 0.40, p);
      const breath = Math.sin(TAU * t / 4.2);
      const vis = (el, o) => { el.style.opacity = o.toFixed(3); el.style.visibility = o < 0.004 ? 'hidden' : 'visible'; };

      // hero text leaves first
      const ho = 1 - sm(0.02, 0.095, p);
      vis(this.hero, ho);
      const heroY = g.m ? 0 : -this.heroH / 2 - 10;
      this.hero.style.transform = `translate3d(0,${heroY - 46 * (1 - ho)}px,0)`;

      // icon path
      let ic0 = g.m ? lp(g.iconA, g.iconS, eio(sm(0.365, 0.415, p))) : g.iconA;
      ic0 = lp(ic0, g.iconC, eio(sm(0.86, 0.91, p)));

      // sphere + absorption: the icon is born at the sphere's centre and travels with it, so it never reads as a second object
      const drift = eio(sm(0.07, 0.31, p));
      const sc = lp(g.heroC, ic0, drift);
      const ic = sc;
      const R = g.R * (1 - 0.32 * drift);
      const bodyO = 1 - sm(0.09, 0.26, p);
      vis(this.orb, bodyO); vis(this.floor, bodyO);
      const od = R * 3.1 / 100;
      this.orb.style.transform = `translate3d(${sc[0] - 50}px,${sc[1] - 50}px,0) scale(${od.toFixed(3)})`;
      this.floor.style.transform = `translate3d(${sc[0] - 50}px,${sc[1] + R * 1.36 - 50}px,0) scale(${(R * 1.9 / 100).toFixed(3)},${(R * 0.26 / 100).toFixed(3)})`;
      const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
      let pulse = 0;
      for (let i = 0; i < N; i++) {
        const el = this.items[i], d = DIRS[i];
        // rotate Y then X
        const x1 = d[0] * cy + d[2] * sy, z1 = -d[0] * sy + d[2] * cy;
        const y2 = d[1] * cp - z1 * sp, z2 = d[1] * sp + z1 * cp;
        const X = x1 * R, Y = y2 * R, Z = z2 * R;
        const s = g.persp / (g.persp - Z);
        const depth = (z2 + 1) / 2;
        const sx = sc[0] + X * s, sy2 = sc[1] + Y * s;
        let scale = s * g.iSc * (0.62 + 0.38 * depth) * FIT[i];
        // front-facing items are fully opaque and recede under a cream wash; only back-facing items fade
        let op = 0.25 + 0.75 * sm(0.05, 0.38, depth);
        let wash = 0.8 * Math.pow(1 - depth, 1.3);
        let px = sx, py = sy2, z = 1 + Math.round(depth * 28), rot = -x1 * 24;
        const st = ABS0 + RANK[i] * ABS_STEP, arr = st + ABS_DUR;
        const t = clamp((p - st) / ABS_DUR);

          const e = t * t * (1.35 - 0.35 * t);

          const dx = ic[0] - sx, dy = ic[1] - sy2;

          const c1 = [mx - dy * bend, my + dx * bend];
          const u = 1 - e;
          px = u * u * sx + 2 * u * e * c1[0] + e * e * ic[0];
          py = u * u * sy2 + 2 * u * e * c1[1] + e * e * ic[1];
          scale = lerp(scale, 0.1 * g.iSc, Math.pow(t, 1.4));
          op = lerp(op, 1, Math.min(1, t * 2.5)) * (1 - sm(0.72, 1, t));
          wash = lerp(wash, 0, Math.min(1, t * 2.5));
          rot *= (1 - t);
          z = 30;
        }
        if (p >= arr) { const x = (p - arr) / 0.003; pulse = Math.max(pulse, x * Math.exp(1 - x)); }
        if (t >= 1) { el.style.visibility = 'hidden'; continue; }
        el.style.visibility = 'visible';
        el.style.opacity = op >= 0.999 ? '1' : op.toFixed(3);
        this.washes[i].style.opacity = wash.toFixed(3);
        el.style.zIndex = z;
        el.style.transform = `translate3d(${px.toFixed(1)}px,${py.toFixed(1)}px,0) translate(-50%,-50%) rotateY(${rot.toFixed(2)}deg) scale(${scale.toFixed(4)})`;
      }

      // icon
      const io = sm(0.05, 0.105, p);
      const iscale = (0.62 + 0.38 * back(sm(0.05, 0.125, p))) * (1 + 0.075 * pulse) * (1 + 0.024 * settled * breath);
      vis(this.icon, io);
      // a physical tile: a very slow tilt (idle loop) plus a small lean toward the mouse, never past 6 degrees
      const rx = clamp(3.2 * Math.sin(TAU * t / 10.5) + 2.6 * this.tilt[1], -6, 6);
      const ry = clamp(3.8 * Math.sin(TAU * t / 13.5 + 1.2) + 2.8 * this.tilt[0], -6, 6);
      this.icon.style.transform = `translate3d(${ic[0] - g.iconSize / 2}px,${ic[1] - g.iconSize / 2}px,0) scale(${iscale.toFixed(4)}) perspective(560px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
      this.icon.style.setProperty('--lx', (30 - 2.4 * ry).toFixed(1) + '%');
      this.icon.style.setProperty('--ly', (16 + 2.4 * rx).toFixed(1) + '%');
      // contact shadow on the ground: tightens as the tile breathes up, slides a touch against the tilt
      vis(this.ishadow, io);
      const shH = g.iconSize === 112 ? 26 : 22;
      this.ishadow.style.transform = `translate3d(${(ic[0] - g.iconSize / 2 - 0.9 * ry).toFixed(1)}px,${(ic[1] + g.iconSize * 0.5 * iscale - shH / 2 + 5).toFixed(1)}px,0) scale(${(iscale * (1.04 - 0.04 * settled * breath)).toFixed(3)},${(iscale * (1 - 0.06 * settled * breath)).toFixed(3)})`;

      // halo: arrivals flash it; emission holds it
      const emit = sm(0.37, 0.45, p) * (1 - sm(0.84, 0.90, p));
      const glowB = settled * (0.5 + 0.5 * breath);
      const ho2 = Math.min(1, 0.5 * pulse * sm(0.08, 0.12, p) + emit * (0.82 + 0.13 * glowB) + sm(0.89, 0.94, p) * 0.5 + settled * (1 - emit) * (0.16 + 0.22 * glowB));
      vis(this.halo, ho2);
      this.halo.style.transform = `translate3d(${ic[0]}px,${ic[1]}px,0) scale(${(0.7 + 0.35 * emit + 0.15 * pulse + 0.05 * glowB).toFixed(3)})`;

      // which scene is "active" (the latest one open, before the fold back)
      let act = -1;
      for (let k = 0; k < 4; k++) if (p >= SCENE_OPEN[k] + 0.02 && p < 0.82) act = k;
      if (act !== this.beatK) { this.beatK = act; if (act >= 0) this.beatAt[act] = t; }
      this.beats(act, act >= 0 ? t - this.beatAt[act] : 0);

      // nodes of light, then scenes
      const back2 = sm(0.82, 0.86, p);         // scenes fold back into nodes
      const retract = sm(0.845, 0.885, p);        // nodes return to the icon
      for (let k = 0; k < 4; k++) {
        const out = eo(sm(0.366 + 0.012 * k, 0.405 + 0.012 * k, p));
        const T = g.nodeT[k];
        let np = lp(ic, T, out);
        let no = out * (1 - sm(0.6, 1, retract));
        const node = this.nodes[k], line = this.lines[k];

        // scene
        const o0 = SCENE_OPEN[k];
        let open = sm(o0, o0 + 0.045, p);
        if (g.m && k < 3) open *= 1 - sm(o0 + 0.072, o0 + 0.09, p);
        // phone shows one scene at a time: after the first one opens, a light only shows while its own scene does
        if (g.m) no *= Math.max(1 - sm(SCENE_OPEN[0], SCENE_OPEN[0] + 0.03, p), sm(0, 0.3, open));
        open *= 1 - back2;
        const dim = (!g.m && k < 3 && !this.noDim) ? sm(o0 + 0.08, o0 + 0.1, p) * (1 - back2) : 0;
        const ep = eo(open);
        const pos = lp(T, g.sceneP[k], ep);
        // finished scenes step back gently (slightly smaller, a touch lighter), never grey
        const s = g.sceneSc * lerp(0.06, 1, back(open)) * (1 - 0.07 * dim);
        const sEl = this.scenes[k];
        vis(sEl, sm(0, 0.35, open) * (1 - 0.15 * dim));
        sEl.style.zIndex = 10 + (dim ? 0 : 5);
        sEl.style.transform = `translate3d(${pos[0].toFixed(1)}px,${pos[1].toFixed(1)}px,0) translate(-50%,-50%) scale(${s.toFixed(4)})`;
        // the light docks on the scene's edge facing the icon, so lines never cross a scene
        if (open > 0.001) {
          const [W, H] = this.sceneWH[k];
          const dx = ic[0] - pos[0], dy = ic[1] - pos[1];
          const hw = W * s / 2 + 12, hh = H * s / 2 + 12;
          const t = Math.min(Math.abs(dx) > 1e-3 ? hw / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-3 ? hh / Math.abs(dy) : 1e9);
          const edge = t < 1 ? [pos[0] + dx * t, pos[1] + dy * t] : ic;
          np = lp(np, edge, eo(Math.min(1, open * 1.4)));
        }
        np = lp(np, ic, ei(retract));
        // the links pulse: a slow wave runs out from the icon, node by node
        const lw = Math.sin(TAU * t / 3.2 - k * 1.1);
        vis(node, no);
        node.style.zIndex = 16;
        node.style.transform = `translate3d(${np[0].toFixed(1)}px,${np[1].toFixed(1)}px,0) scale(${((0.6 + 0.4 * out) * (1 + 0.14 * settled * lw)).toFixed(3)})`;
        line.setAttribute('x1', ic[0]); line.setAttribute('y1', ic[1]);
        line.setAttribute('x2', np[0].toFixed(1)); line.setAttribute('y2', np[1].toFixed(1));
        line.style.opacity = (no * 0.9 * (1 - 0.38 * settled * (0.5 - 0.5 * lw))).toFixed(3);
        // a spark of light travels out along each link, one at a time
        const spk = this.sparks[k], f = ((t / 3.6 + k * 0.25) % 1) / 0.55;
        if (no > 0.01 && f < 1 && settled > 0) {
          const e2 = eio(f);
          spk.setAttribute('cx', lerp(ic[0], np[0], e2).toFixed(1)); spk.setAttribute('cy', lerp(ic[1], np[1], e2).toFixed(1));
          spk.style.opacity = (no * settled * Math.sin(Math.PI * f) * 0.95).toFixed(3);
        } else spk.style.opacity = '0';

        // caption for this scene
        // phone: one title at a time in the top band. desktop: each title stays directly over its own scene and steps back with it
        const cEnd = g.m && k < 3 ? o0 + 0.09 : 0.82;
        const co = sm(o0 + 0.012, o0 + 0.04, p) * (1 - sm(cEnd - 0.012, cEnd + 0.004, p));
        if (g.m) {
          vis(this.capS[k], co);
          this.capS[k].style.transform = `translate3d(0,${(g.capS + 14 * (1 - co)).toFixed(1)}px,0) translateY(-50%)`;
        } else {
          const P = g.sceneP[k], H = this.sceneWH[k][1];
          const top = P[1] - H * g.sceneSc * (1 - 0.07 * dim) / 2 - 16 * g.k;
          vis(this.capS[k], co * (1 - 0.3 * dim));
          this.capS[k].style.transform = `translate3d(${(P[0] - w / 2).toFixed(1)}px,${(top + 12 * (1 - co)).toFixed(1)}px,0) translateY(-100%)`;
        }
      }

      // absorption caption
      const ca = sm(0.285, 0.33, p) * (1 - sm(0.38, 0.405, p));
      vis(this.capA, ca);
      this.capA.style.transform = `translate3d(0,${(g.capA + 18 * (1 - ca)).toFixed(1)}px,0) translateY(-50%)`;

      // close
      const cl = sm(0.885, 0.935, p);
      vis(this.close, cl);
      this.close.style.transform = `translate3d(0,${(g.closeTop + 26 * (1 - cl)).toFixed(1)}px,0)`;
      return { hero: ho, close: cl };
    }

    // one small living beat for the active scene; u = seconds since it became active.
    // every beat starts from (and returns to) the scene's resting, complete look.
    beats(act, u) {
      const TAU = Math.PI * 2;
      // 0 crossword: the across word clears softly, then fills back in letter by letter
      {
        const C = 7.6, ph = act === 0 ? u % C : 0, STEP = 0.62, F0 = 3.6;
        this.xwFill.forEach(([d, l], j) => {
          let o = 1, sc = 1, cur = false;
          if (act === 0 && ph >= 2.9) {
            const at = F0 + j * STEP;
            if (ph < F0) o = 1 - sm(2.9, 3.4, ph);
            else if (ph < at) { o = 0; cur = ph >= at - STEP; }
            else { const q = clamp((ph - at) / 0.32); o = q; sc = 0.6 + 0.4 * back(q); }
          }
          l.style.opacity = o.toFixed(3);
          l.style.transform = sc === 1 ? '' : `scale(${sc.toFixed(3)})`;
          d.classList.toggle('cur', cur);
        });
      }
      // 1 trivia: the right answer glows softly
      {
        const gl = act === 1 ? 0.5 - 0.5 * Math.cos(TAU * u / 2.8) : 0;
        this.ansOn.style.boxShadow = gl ? `0 0 0 ${(2 + 4 * gl).toFixed(1)}px rgba(78,205,196,${(0.12 + 0.16 * gl).toFixed(3)}),0 12px 22px -12px rgba(45,131,119,.8)` : '';
      }
      // 2 feed: the cards drift a few pixels, out of step with each other
      this.feedCards.forEach((c, j) => {
        const ramp = Math.min(1, u);
        c.style.transform = act === 2 ? `translate3d(${(1.5 * Math.sin(TAU * u / 7 + j * 2.1) * ramp).toFixed(2)}px,${(3.2 * Math.sin(TAU * u / 5.2 + j * 1.7) * ramp).toFixed(2)}px,0)` : '';
      });
      // 3 daily round: the last third of the ring fills, glows, and lets go
      {
        let f = 0, glow = 0;
        if (act === 3) {
          const ph = u % 7.2;
          f = ph < 1.0 ? 0 : ph < 3.6 ? eio((ph - 1.0) / 2.6) : ph < 6.2 ? 1 : 1 - sm(6.2, 7.0, ph);
          glow = ph < 3.6 ? 0 : sm(3.6, 4.2, ph) * (1 - sm(5.6, 6.6, ph));
        }
        const L = this.ringLen;
        this.ringFill.setAttribute('stroke-dashoffset', (L * (1 - f)).toFixed(1));
        this.ringFill.style.opacity = f > 0.002 ? 1 : 0;
        this.ringCore.style.opacity = (0.35 + 0.65 * glow).toFixed(3);
        this.ringCore.style.transform = `scale(${(0.85 + 0.2 * glow).toFixed(3)})`;
        this.chip3.style.opacity = (0.5 + 0.5 * f).toFixed(3);
      }
    }
  }

  const story = document.getElementById('story');
  const REST_YAW = 0.55, REST_PITCH = -0.32;

  // one action at a time: the top-bar link hides while the hero or a closing button is on screen
  const navGet = document.querySelector('.nav-get');
  let navOn = null;
  const syncNav = on => { if (on !== navOn) { navOn = on; navGet.classList.toggle('on', on); } };

  if (STATIC) {
    const ps = innerWidth < 760 ? [0, 0.365, 0.45, 0.54, 0.63, 0.76, 1] : [0, 0.365, 0.80, 1];
    const stages = ps.map(p => {
      const s = document.createElement('div'); s.className = 'sticky'; story.appendChild(s);
      const st = new Stage(s); st.p = p; st.noDim = true; return st;
    });
    const draw = () => stages.forEach(st => { st.measure(); st.render(st.p, REST_YAW, REST_PITCH); });
    draw(); addEventListener('resize', draw);
    document.fonts && document.fonts.ready.then(draw);
    let heroIn = true, closeIn = false;
    const sync = () => syncNav(!heroIn && !closeIn);
    sync();
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(es => { heroIn = es[es.length - 1].isIntersecting; sync(); }).observe(stages[0].host.querySelector('.hero .cta'));
      new IntersectionObserver(es => { closeIn = es[es.length - 1].isIntersecting; sync(); }).observe(stages[stages.length - 1].host.querySelector('.close .cta'));
    } else syncNav(true);
    return;
  }

  const sticky = document.createElement('div'); sticky.className = 'sticky'; story.appendChild(sticky);
  const S = new Stage(sticky);
  // motion runs by default (pinned captures too); ?static=1 is the only off switch
  const live = true;
  const interactive = AT === null;
  // the icon's pointer lean is for a real mouse only: never on touch screens (the idle tilt still runs there)
  const FINE = matchMedia('(hover: hover) and (pointer: fine)').matches;

  let yaw = REST_YAW, pitch = REST_PITCH, tYaw = 0, tPitch = 0, oYaw = 0, oPitch = 0, tTx = 0, tTy = 0;
  let onScreen = true, raf = 0, last = 0, queued = false, idle = 0;

  const progress = () => {
    if (AT !== null) return AT;
    const r = story.getBoundingClientRect();
    const span = story.offsetHeight - innerHeight;
    return span > 0 ? clamp(-r.top / span) : 0;
  };
  const sphereVisible = p => p < 0.37;

  const closeCta = sticky.querySelector('.close .cta');
  function draw() {
    const r = S.render(progress(), yaw + oYaw, pitch + oPitch, idle / 1000);
    let closeIn = r.close > 0.15;
    if (closeIn) { const b = closeCta.getBoundingClientRect(); closeIn = b.bottom > 0 && b.top < innerHeight; }
    syncNav(r.hero < 0.15 && !closeIn);
  }

  // one loop for all idle motion: 30 fps cap, only while the story is on screen and the tab is visible.
  // the sphere turns while it exists; after absorption the icon breathes, links pulse, the active scene lives.
  function tick(ts) {
    raf = 0;
    if (!live || !onScreen || document.hidden) { draw(); return; }
    if (ts - last >= 33) {
      const dt = last ? Math.min(100, ts - last) : 33;
      last = ts;
      idle += dt;
      if (sphereVisible(progress())) yaw += dt * 0.00016;
      oYaw += (tYaw - oYaw) * 0.08; oPitch += (tPitch - oPitch) * 0.08;
      S.tilt[0] += (tTx - S.tilt[0]) * 0.06; S.tilt[1] += (tTy - S.tilt[1]) * 0.06;
      draw();
    }
    raf = next(tick);
  }
  // headless capture (?motion=1) has no painted frames, so it steps on a 30 fps timer instead of rAF
  const next = SETTLE ? f => setTimeout(() => f(performance.now()), 33) : f => requestAnimationFrame(f);
  function wake() { if (!raf) { last = 0; raf = next(tick); } }
  function onScroll() {
    if (queued) return; queued = true;
    requestAnimationFrame(() => { queued = false; draw(); wake(); });
  }

  S.measure(); draw();
  document.fonts && document.fonts.ready.then(() => { S.measure(); draw(); });
  addEventListener('resize', () => { S.measure(); draw(); });
  if (AT === null) addEventListener('scroll', onScroll, { passive: true });

  if (live) {
    new IntersectionObserver(es => { onScreen = es[es.length - 1].isIntersecting; if (onScreen) wake(); }).observe(story);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
    // a little hand on the sphere: the pointer leans it
    if (interactive) addEventListener('pointermove', e => {
      tYaw = (e.clientX / innerWidth - 0.5) * 0.5;
      tPitch = (e.clientY / innerHeight - 0.5) * -0.22;
      // the icon tile leans toward a mouse (desktop only): right of centre turns it right, above centre tips it up
      if (e.pointerType === 'mouse' && FINE) { tTx = clamp((e.clientX / innerWidth - 0.5) * 2, -1, 1); tTy = clamp((0.5 - e.clientY / innerHeight) * 2, -1, 1); }
      wake();
    }, { passive: true });
    wake();
  }
})();
</script>
</body>
</html>
