<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Share REPS</title>
  <meta property="og:title" content="REPS - Supercharge your memory" />
  <meta property="og:description" content="Save anything. Remember everything." />
  <style>
    :root {
      --cream: #FFFAF7;
      --ink: #211A14;
      --muted: #6B6B6B;
      --coral: #FF6B6B;
      --peach: #FF8E53;
      --border: #EDE8E3;
      --tint: #FFF1EC;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .wordmark {
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.08em;
      color: var(--ink);
      margin-bottom: 28px;
    }
    h1 {
      font-size: 27px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
    }
    .sub {
      font-size: 16px;
      line-height: 1.5;
      color: var(--muted);
      margin: 0 0 30px;
    }
    .btn {
      display: block;
      width: 100%;
      border: 0;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      background: var(--coral);
      background-image: linear-gradient(135deg, var(--coral), var(--peach));
      padding: 17px 24px;
      border-radius: 100px;
      text-decoration: none;
      box-shadow: 0 12px 28px -12px rgba(255, 107, 107, 0.6);
    }
    .btn:active { transform: translateY(1px); }
    .fallbacks {
      margin-top: 18px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .fallbacks.show { display: flex; }
    .btn-secondary {
      display: block;
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      padding: 14px 20px;
      border-radius: 100px;
      text-decoration: none;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 100px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .foot { margin-top: 34px; font-size: 12px; color: var(--muted); }
    .foot a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">REPS</div>
    <h1>Share REPS with a friend</h1>
    <p class="sub">One good word from you beats any ad. Send it to someone who would love it.</p>

    <button class="btn" id="share-btn" type="button">Share REPS</button>

    <div class="fallbacks" id="fallbacks">
      <a class="btn-secondary" id="wa" href="#" target="_blank" rel="noopener">Share on WhatsApp</a>
      <button class="btn-secondary" id="copy" type="button">Copy link</button>
      <a class="btn-secondary" id="mail" href="#">Share by email</a>
    </div>

    <div class="foot"><a href="https://getreps.io">getreps.io</a></div>
  </div>

  <div class="toast" id="toast">Link copied</div>

  <script>
    (function () {
      // What the friend receives, and the message that goes with it.
      var URL_TO_SHARE = "https://apps.apple.com/app/id6759216018";
      var TITLE = "REPS";
      var TEXT = "I've been using REPS to actually remember what I read and watch. Thought you'd like it:";

      var shareBtn = document.getElementById("share-btn");
      var fallbacks = document.getElementById("fallbacks");
      var toast = document.getElementById("toast");

      // Wire up the fallback links up front.
      var waMsg = encodeURIComponent(TEXT + " " + URL_TO_SHARE);
      document.getElementById("wa").href = "https://wa.me/?text=" + waMsg;
      document.getElementById("mail").href =
        "mailto:?subject=" + encodeURIComponent("You should try REPS") +
        "&body=" + encodeURIComponent(TEXT + "\n\n" + URL_TO_SHARE);

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        setTimeout(function () { toast.classList.remove("show"); }, 1800);
      }

      function copyLink() {
        var payload = URL_TO_SHARE;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(payload).then(
            function () { showToast("Link copied"); },
            function () { showToast("Copy failed, long-press the link"); }
          );
        } else {
          showToast("Long-press to copy: " + payload);
        }
      }
      document.getElementById("copy").addEventListener("click", copyLink);

      // Primary button: native share sheet where supported, fallbacks otherwise.
      if (navigator.share) {
        shareBtn.addEventListener("click", function () {
          navigator.share({ title: TITLE, text: TEXT, url: URL_TO_SHARE }).catch(function () {
            // User cancelled or share failed: reveal the fallbacks as a backup.
            fallbacks.classList.add("show");
          });
        });
      } else {
        // No Web Share API (most desktop browsers): swap the primary for the fallback set.
        shareBtn.style.display = "none";
        fallbacks.classList.add("show");
      }
    })();
  </script>
</body>
</html>
