<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #fffaf7;
        font-family:
          "Space Grotesk",
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        padding: 0 80px;
        gap: 60px;
      }
      .left {
        flex: 1;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 36px;
      }
      .logo img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(33, 26, 20, 0.14);
      }
      .logo-text {
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.04em;
        color: #211a14;
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ff6b6b;
        margin-bottom: 18px;
      }
      h1 {
        font-weight: 700;
        font-size: 54px;
        line-height: 1.04;
        letter-spacing: -0.025em;
        color: #211a14;
        margin-bottom: 22px;
      }
      .grad {
        background: linear-gradient(100deg, #ff6b6b, #ff8e53);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .sub {
        font-size: 20px;
        color: rgba(33, 26, 20, 0.68);
        line-height: 1.5;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 36px;
        background: linear-gradient(135deg, #ff6b6b, #ff8e53);
        color: #fff;
        font-weight: 600;
        font-size: 17px;
        padding: 12px 26px;
        border-radius: 999px;
        box-shadow: 0 4px 20px -4px rgba(255, 107, 107, 0.45);
      }
      .right {
        flex: none;
        width: 440px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .galaxy-img {
        width: 500px;
        height: auto;
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="left">
      <div class="logo">
        <img src="product/assets/app-icon.png" alt="REPS" />
        <span class="logo-text">REPS</span>
      </div>
      <div class="eyebrow">Your second brain</div>
      <h1>Supercharge your <span class="grad">memory</span></h1>
      <p class="sub">
        Finally remember everything you read,<br />watch, and hear.
      </p>
      <div class="badge">Join the waitlist</div>
    </div>
    <div class="right">
      <img class="galaxy-img" src="brain-nobg.png" alt="" />
    </div>
  </body>
</html>
