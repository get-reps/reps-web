<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A friend is inviting you to REPS</title>
  <meta name="description" content="A friend is inviting you to REPS. Save what you read and watch. Actually remember it.">
  <meta property="og:title" content="A friend is inviting you to REPS">
  <meta property="og:description" content="Save what you read and watch. Actually remember it.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#fffaf7">
  <!-- Backstop for js/invite-preview.js's cleanAvatarUrl allowlist: even a bug there could not load
       an inviter's avatar_url from an arbitrary host, since the browser would refuse it outright. -->
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' https://vciosaulrfvddcenblmo.supabase.co https://lh3.googleusercontent.com data:">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fffaf7;
      --coral: #ff6b6b;
      --peach: #ff8e53;
      --ink: #211a14;
      --body: rgba(33, 26, 20, 0.66);
      --muted: rgba(33, 26, 20, 0.5);
      --display: "Space Grotesk", system-ui, -apple-system, sans-serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--cream); }
    body {
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      overflow-x: hidden;
      background:
        radial-gradient(60% 45% at 50% 30%, rgba(255, 142, 83, 0.20), transparent 70%),
        radial-gradient(50% 35% at 50% 100%, rgba(255, 107, 107, 0.10), transparent 70%),
        var(--cream);
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    /* Hero: inviter photo, their initial, or Echo (generic). Same footprint in every state. */
    .hero { position: relative; width: 148px; height: 148px; margin: 0 auto 28px; }
    .ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, var(--coral), var(--peach));
      box-shadow: 0 18px 40px -12px rgba(255, 107, 107, 0.55);
    }
    .ring-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--cream);
      border: 4px solid var(--cream);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-slot {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ring-inner img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* A photo that missed the reveal deadline fades in over the monogram instead of popping. */
    .ring-inner img.late { position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s ease-out; }
    .ring-inner img.late.shown { opacity: 1; }
    .ring-inner img.echo { width: 118%; height: 118%; object-fit: contain; transform: translateY(4%); }
    .monogram {
      font-family: var(--display);
      font-weight: 700;
      font-size: 64px;
      line-height: 1;
      background: linear-gradient(135deg, var(--coral), var(--peach));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .badge {
      position: absolute;
      right: -6px;
      bottom: -2px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 0 6px 16px -6px rgba(33, 26, 20, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .badge img { width: 120%; height: 120%; object-fit: contain; }
    .is-personal .badge { display: flex; animation: pop 0.45s 0.15s cubic-bezier(0.3, 1.5, 0.5, 1) both; }

    h1 {
      min-height: 2.16em; /* two lines, so a one-line name never pulls the card up on reveal */
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(30px, 8.4vw, 40px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .name {
      background: linear-gradient(135deg, var(--coral), var(--peach));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      overflow-wrap: anywhere;
    }
    .support { font-size: 17px; line-height: 1.45; color: var(--body); margin: 0 auto 32px; max-width: 320px; }

    .open-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      background: linear-gradient(135deg, var(--coral), var(--peach));
      color: #fff;
      font-family: var(--display);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.01em;
      padding: 18px 28px;
      border-radius: 18px;
      text-decoration: none;
      box-shadow: 0 14px 30px -12px rgba(255, 107, 107, 0.75);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .open-btn:hover { transform: translateY(-1px); box-shadow: 0 18px 34px -12px rgba(255, 107, 107, 0.85); }
    .open-btn:active { transform: scale(0.97); }
    .open-btn svg { width: 20px; height: 20px; }
    .secondary { font-size: 14px; color: var(--muted); margin-top: 20px; }
    .secondary a { color: var(--coral); font-weight: 600; text-decoration: none; }
    .wordmark {
      margin-top: 40px;
      font-family: var(--display);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.24em;
      color: var(--muted);
    }

    /* Hold: while the inviter lookup is in flight, the inviter-dependent parts keep their
       space but show nothing, and the empty avatar circle breathes. The page then reveals ONE
       final state (personal or generic) in a single fade - never generic first, then a swap. */
    [data-hold] { transition: opacity 0.3s ease-out, visibility 0s; }
    .invite-loading [data-hold] { opacity: 0; visibility: hidden; }
    .invite-loading .ring-inner { animation: breathe 1.4s ease-in-out infinite; }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 0%, 100% { background-color: var(--cream); } 50% { background-color: #ffe6d8; } }
    @media (prefers-reduced-motion: reduce) {
      .card, .is-personal .badge, .invite-loading .ring-inner { animation: none; }
      [data-hold], .ring-inner img.late { transition: none; }
    }
  </style>
  <script>
    // Runs before first paint. Only a well-formed code can personalize, so only then does the
    // page hold its inviter-dependent parts back. No JS, or a missing/malformed code: no hold,
    // the generic page paints immediately.
    (function () {
      var code = (new URLSearchParams(window.location.search).get('code') || '').trim().toUpperCase();
      if (!/^[A-HJ-NP-Z2-9]{8}$/.test(code)) return;
      var root = document.documentElement;
      var settled = false;
      root.classList.add('invite-loading');
      // Same 2.5 s budget as js/invite-preview.js's TIMEOUT_MS, measured from here.
      window.repsInviteDeadline = performance.now() + 2500;
      // First caller wins and later calls are ignored, so the page can never change state twice.
      window.repsInviteReveal = function (apply) {
        if (settled) return false;
        settled = true;
        clearTimeout(failsafe);
        if (apply) apply();
        root.classList.remove('invite-loading');
        return true;
      };
      // Backstop if the personalization module never runs (failed to load, old browser):
      // show the generic page, never a blank or stuck one.
      var failsafe = setTimeout(function () { window.repsInviteReveal(null); }, 2800);
    })();
  </script>
</head>
<body>
  <main class="card" id="card">
    <!-- Generic state is the static markup, so with no JS, an unknown code or a failed
         lookup the page is already complete. js/invite-preview.js only ever upgrades it. -->
    <div class="hero">
      <div class="ring"><div class="ring-inner"><div class="hero-slot" id="hero-slot" data-hold>
        <img class="echo" src="/echo/echo-phone-emoji.png" alt="" width="148" height="148">
      </div></div></div>
      <div class="badge" aria-hidden="true"><img src="/echo/echo-phone-emoji.png" alt=""></div>
    </div>
    <h1 id="headline" data-hold><span class="name" id="inviter-name">A friend</span> is inviting you to REPS</h1>
    <p class="support" data-hold>Save what you read and watch. Actually remember it.</p>
    <a id="open-link" class="open-btn" href="https://apps.apple.com/app/id6759216018">
      Accept invite
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="secondary">Already have REPS? <a id="app-link" href="#">Open the app</a></p>
    <div class="wordmark">REPS</div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = (params.get('code') || '').trim().toUpperCase();
      var source = (params.get('source') || '').trim().toLowerCase();

      // Same bounded GENERIC grammar the RPC uses, deliberately not a two-value whitelist:
      // adding a third consumer surface must not require a web deploy. The app's own
      // InviteSurface union is the tight gate.
      var CODE_RE = /^[A-HJ-NP-Z2-9]{8}$/;      // generate_referral_code()'s alphabet (no I/O/0/1)
      var SURFACE_RE = /^[a-z][a-z0-9_]{0,31}$/;

      if (!CODE_RE.test(code)) return;          // leave both CTAs at their safe defaults
      if (!SURFACE_RE.test(source)) source = '';

      // PRIMARY CTA: OneLink. This page's audience is by definition people who do NOT have
      // the app, and AppsFlyer picks the installed-app-vs-store destination itself while
      // preserving deep_link_sub1/sub2 through the store round-trip for deferred delivery.
      //
      // `1zdF` is the live `organic_social` template on repsapp.onelink.me, used in its
      // established long-form query-param mode. It is a NATIVE App-Store-mode template (no
      // baked-in ct=), so AppsFlyer attribution applies cleanly and no new template is needed.
      // NOTE: repsapp.onelink.me - `reps.onelink.me` belongs to a different AppsFlyer customer.
      var oneLink =
        'https://repsapp.onelink.me/1zdF' +
        '?pid=organic_social' +
        '&c=referral_v1' +
        '&deep_link_value=invite' +
        '&deep_link_sub1=' + encodeURIComponent(code) +
        (source ? '&deep_link_sub2=' + encodeURIComponent(source) : '');
      document.getElementById('open-link').href = oneLink;

      // SECONDARY, explicit-tap only. There is deliberately NO page-load auto-redirect to the
      // custom scheme: for the no-app-installed majority that surfaces a raw browser error.
      var deepLink =
        'reps://invite?code=' + encodeURIComponent(code) +
        (source ? '&source=' + encodeURIComponent(source) : '');
      document.getElementById('app-link').href = deepLink;
    })();
  </script>
  <script type="module">
    // Personalization only. Never touches the CTA hrefs set above.
    import { fetchInvitePreview } from '/js/invite-preview.js';

    // The head script only sets up the hold for a well-formed code; without it there is
    // nothing to reveal and the generic page is already showing.
    var reveal = window.repsInviteReveal;
    var deadline = window.repsInviteDeadline;
    if (reveal) {
      var remaining = function () { return Math.max(0, deadline - performance.now()); };
      var code = new URLSearchParams(window.location.search).get('code') || '';
      var preview = await fetchInvitePreview(code, { timeoutMs: remaining() });

      // Wait for the photo too (same deadline), so it never pops in after the headline.
      var img = null;
      var photoReady = false;
      if (preview && preview.avatarUrl) {
        img = new Image();
        img.alt = preview.firstName;
        img.referrerPolicy = 'no-referrer';
        img.src = preview.avatarUrl;
        photoReady = await Promise.race([
          img.decode().then(function () { return true; }, function () { return false; }),
          new Promise(function (resolve) { setTimeout(resolve, remaining(), false); }),
        ]);
      }

      reveal(preview && function () {
        var nameEl = document.getElementById('inviter-name');
        var slot = document.getElementById('hero-slot');

        nameEl.textContent = preview.firstName;
        document.title = preview.firstName + ' is inviting you to REPS';
        document.getElementById('card').classList.add('is-personal');

        if (photoReady) {
          slot.replaceChildren(img);
          return;
        }
        // No photo in time (or none at all): their initial. A photo that is merely slow fades
        // in over it later; a dead image URL never shows a broken picture.
        var mono = document.createElement('span');
        mono.className = 'monogram';
        mono.textContent = Array.from(preview.firstName)[0].toUpperCase();
        slot.replaceChildren(mono);
        if (img) {
          img.className = 'late';
          img.decode().then(function () {
            slot.appendChild(img);
            void img.offsetWidth;
            img.classList.add('shown');
          }, function () {});
        }
      });
    }
  </script>
</body>
</html>
